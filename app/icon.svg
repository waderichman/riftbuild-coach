<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f26"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f7bff"/>
      <stop offset="100%" stop-color="#30e7c9"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#glow)" stroke-width="2"/>

  <!-- Horns -->
  <path d="M19 24c-3-2-4-6-1-9 4-3 9 0 10 5z" fill="#f3f6ff"/>
  <path d="M45 24c3-2 4-6 1-9-4-3-9 0-10 5z" fill="#f3f6ff"/>

  <!-- Poro body -->
  <ellipse cx="32" cy="34" rx="17" ry="14" fill="#f7f9ff"/>

  <!-- Eyes -->
  <circle cx="26.5" cy="33" r="2.4" fill="#0b1229"/>
  <circle cx="37.5" cy="33" r="2.4" fill="#0b1229"/>

  <!-- Nose -->
  <ellipse cx="32" cy="38" rx="2.5" ry="1.8" fill="#ff8d9f"/>

  <!-- Mustache fluff -->
  <path d="M22 40c2 2 5 3 8 2" stroke="#d5dbf0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M42 40c-2 2-5 3-8 2" stroke="#d5dbf0" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Arcane-style glow accents -->
  <circle cx="20" cy="17" r="1.2" fill="#7d6cff"/>
  <circle cx="44" cy="14" r="1" fill="#32e6c8"/>
  <circle cx="49" cy="21" r="0.9" fill="#7d6cff"/>
</svg>
